[project]
name = "claude-mcp-probe"
version = "0.1.0"
description = "Standalone Claude Agent SDK MCP tool-search probe."
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_mcp_probe"]
