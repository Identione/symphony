[project]
name = "symphony-claude-agent"
version = "0.1.0"
description = "Symphony's Claude Agent SDK sidecar (SPEC.md §10.8)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Floor is deliberate, not cosmetic. The SDK pins the bundled Claude Code CLI
  # (and `_find_cli` prefers the bundled binary over anything on PATH, so this
  # pin alone decides CLI behaviour). 0.2.131 ships CLI 2.1.223, clearing two
  # bugs that bite hardest in the subagent fan-out this sidecar now relies on:
  # before 2.1.199 a rate-limited subagent returned its error text as if it were
  # findings, and before 2.1.211 completion could be reported prematurely.
  "claude-agent-sdk>=0.2.131",
]

[project.scripts]
symphony-claude-agent = "symphony_claude_agent.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symphony_claude_agent"]
